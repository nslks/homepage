    summary:
      de: Schimmelprävention mit eigenen Sensoren. Arduino-Sensoren messen Temperatur und Luftfeuchte, eine lokale KI entscheidet, ob gelüftet oder geheizt werden soll, und schickt die Empfehlung als Push-Nachricht aufs Handy. Über einen eigenen MCP-Server kann ein KI-Agent auch längere Verläufe auswerten.
