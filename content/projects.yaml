  - name: Climora
    summary:
      de: Schimmelprävention mit eigenen Sensoren. ESP32-Sensoren messen Temperatur und Luftfeuchte und senden per MQTT. Zwei Wege – in Echtzeit entscheidet ein lokales Sprachmodell, ob gelüftet oder geheizt werden soll, und schickt die Empfehlung aufs Handy; für den Verlauf wertet ein KI-Agent über einen eigenen MCP-Server die Zeitreihen aus und zieht Learnings.
      en: ''
    tech: [ESP32, MQTT, Python, FastAPI, InfluxDB, Ollama, MCP, ntfy, Docker]
    status: wip
