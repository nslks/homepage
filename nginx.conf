server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No access log: visitor IPs are not stored on the server (ADR 0004).
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Vite puts a content hash into every file name under /assets: safe to cache forever.
    location /assets/ {
        expires max;
    }

    # Everything else (index.html, models, cv.pdf) keeps its name: always revalidate.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
