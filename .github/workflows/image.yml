name: Container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  image:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # latest for the server to pull, the commit SHA for rollbacks
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMPRESSUM_EMAIL=${{ vars.IMPRESSUM_EMAIL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Same steps as the shared deploy workflow in nslks/server. A public repo can't call a
  # workflow from a private one, so they are spelled out here.
  deploy:
    name: Deploy to the server
    needs: image
    runs-on: ubuntu-latest
    # DEPLOY_SSH_KEY lives in the production environment; the required approval is set there too.
    environment: production
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    steps:
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # pinned host key: the pipeline only talks to exactly this server
          echo "2.29.56.74 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG6NYZTfOoiPNm2J577LZoHLep0wv8HQAcnU0eg/3EsL" > ~/.ssh/known_hosts
      # the key may only run ci-deploy.sh on the server, which only updates known services
      # roll out exactly the image of this commit, not "latest" (tag as in metadata-action: sha-<7 chars>)
      - name: Deploy
        run: ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes nslks@2.29.56.74 "homepage sha-${GITHUB_SHA:0:7}"
